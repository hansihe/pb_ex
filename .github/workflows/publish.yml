name: Publish

# Pushing a tag vX.Y.Z publishes all four libraries at version X.Y.Z.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    # Holds HEX_API_KEY; add required reviewers there to gate releases.
    environment: hex
    steps:
      - uses: actions/checkout@v5

      # Keep in step with mise.toml.
      - uses: erlef/setup-beam@v1
        with:
          otp-version: "28.5"
          elixir-version: "1.20.1"

      - name: Test
        env:
          PB_EX_LOCAL: "1"
        run: |
          for package in cel_ex pb pb_cel pb_validate; do
            (cd "$package" && mix deps.get && mix test)
          done

      - name: Publish
        env:
          HEX_API_KEY: ${{ secrets.HEX_API_KEY }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: scripts/publish.sh --yes
