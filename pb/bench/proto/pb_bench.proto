syntax = "proto3";

package bench;

// Shared benchmark schema for comparing PB against the Elixir `protobuf`
// library. Mirrors the scenarios in bench/codegen_vs_runtime.exs so both
// libraries encode/decode the exact same wire bytes.

enum Role {
  UNKNOWN = 0;
  ADMIN = 1;
  USER = 2;
}

message PhoneNumber {
  string number = 1;
}

message Pet {
  string name = 1;
}

message Fish {
  string species = 1;
}

message Person {
  string name = 1;
  int32 id = 2;
  repeated PhoneNumber phones = 4;
  Role role = 5;
  repeated int32 scores = 6;
  oneof companion {
    Pet pet = 7;
    Fish fish = 8;
  }
  map<string, int32> tags = 9;
}

message Scalars {
  double f_double = 1;
  float f_float = 2;
  int64 f_int64 = 3;
  uint64 f_uint64 = 4;
  int32 f_int32 = 5;
  fixed64 f_fixed64 = 6;
  fixed32 f_fixed32 = 7;
  bool f_bool = 8;
  string f_string = 9;
  bytes f_bytes = 10;
  uint32 f_uint32 = 11;
  sfixed32 f_sfixed32 = 12;
  sfixed64 f_sfixed64 = 13;
  sint32 f_sint32 = 14;
  sint64 f_sint64 = 15;
}

message Packed {
  repeated int32 ints = 1;
  repeated sint64 sint64s = 2;
  repeated double doubles = 3;
  repeated bool bools = 4;
}
